<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Secret Archive</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: white;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 50% 45%, #3b1244 0%, #1d0926 38%, #09050e 100%);
    }

    .archive-page {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Soft glowing background */
    .archive-page::before,
    .archive-page::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.35;
      pointer-events: none;
    }

    .archive-page::before {
      top: 5%;
      left: -80px;
      background: #ff2fc8;
      animation: glowMove 7s ease-in-out infinite alternate;
    }

    .archive-page::after {
      right: -80px;
      bottom: 5%;
      background: #7045ff;
      animation: glowMove 8s ease-in-out infinite alternate-reverse;
    }

    /* Floating text clues */
    .floating-clues {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .floating-clues span {
      position: absolute;
      color: rgba(255, 151, 235, 0.45);
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 1.5px;
      white-space: nowrap;
      animation: floatClue 6s ease-in-out infinite;
    }

    .floating-clues span:nth-child(1) {
      top: 16%;
      left: 10%;
    }

    .floating-clues span:nth-child(2) {
      top: 29%;
      right: 8%;
      animation-delay: 1s;
    }

    .floating-clues span:nth-child(3) {
      top: 52%;
      left: 6%;
      animation-delay: 2s;
    }

    .floating-clues span:nth-child(4) {
      bottom: 20%;
      right: 11%;
      animation-delay: 3s;
    }

    .floating-clues span:nth-child(5) {
      bottom: 31%;
      left: 14%;
      animation-delay: 4s;
    }

    .floating-clues span:nth-child(6) {
      top: 12%;
      right: 20%;
      color: rgba(255, 255, 255, 0.3);
      animation-delay: 1.5s;
    }

    /* Small floating stars */
    .stars {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .stars span {
      position: absolute;
      color: #ffc9f5;
      font-size: 13px;
      opacity: 0.7;
      animation: twinkle 2.5s ease-in-out infinite;
    }

    .stars span:nth-child(1) {
      top: 23%;
      left: 25%;
    }

    .stars span:nth-child(2) {
      top: 68%;
      left: 20%;
      animation-delay: 0.8s;
    }

    .stars span:nth-child(3) {
      top: 35%;
      right: 23%;
      animation-delay: 1.4s;
    }

    .stars span:nth-child(4) {
      bottom: 16%;
      right: 27%;
      animation-delay: 2s;
    }

    /* Main card */
    .archive-card {
      position: relative;
      z-index: 3;
      width: min(84%, 390px);
      padding: 40px 24px 35px;
      text-align: center;
      border: 1px solid #ff52d4;
      border-radius: 17px;
      background: rgba(38, 7, 47, 0.86);
      box-shadow:
        0 0 12px rgba(255, 45, 202, 0.8),
        0 0 35px rgba(255, 45, 202, 0.35),
        inset 0 0 25px rgba(255, 55, 213, 0.13);
      animation: cardAppear 1.2s ease forwards;
    }

    .archive-card::before {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(255, 151, 235, 0.18);
      border-radius: 12px;
      pointer-events: none;
    }

    .small-label {
      margin: 0;
      color: #ffb2ef;
      font-size: 10px;
      letter-spacing: 4px;
      animation: textGlow 2s ease-in-out infinite alternate;
    }

    .archive-card h1 {
      margin: 28px 0 18px;
      color: #ffe0fa;
      font-size: clamp(25px, 8vw, 34px);
      letter-spacing: 4px;
      text-shadow:
        0 0 6px #ff74dd,
        0 0 18px #ff2bc8;
      animation: titlePulse 2.5s ease-in-out infinite;
    }

    .archive-card h1::after {
      content: "_";
      animation: blink 0.8s infinite;
    }

    #typing-text {
      min-height: 25px;
      margin: 0;
      color: #efc5e7;
      font-family: Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .warning-text {
      margin: 18px 0 0;
      color: rgba(255, 205, 245, 0.6);
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .archive-card button {
      position: relative;
      z-index: 2;
      margin-top: 28px;
      padding: 13px 25px;
      border: 1px solid #ff93e5;
      border-radius: 30px;
      color: white;
      background: linear-gradient(90deg, #ff239d, #8c43ff);
      box-shadow:
        0 0 12px rgba(255, 57, 200, 0.8),
        inset 0 0 8px rgba(255, 255, 255, 0.2);
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      transition: 0.3s ease;
    }

    .archive-card button:hover {
      transform: scale(1.08);
      box-shadow:
        0 0 20px #ff39c8,
        0 0 40px rgba(255, 57, 200, 0.5);
    }

    .archive-card button:active {
      transform: scale(0.95);
    }

    .button-shine {
      position: absolute;
      top: 0;
      left: -80%;
      width: 50%;
      height: 100%;
      transform: skewX(-20deg);
      background: rgba(255, 255, 255, 0.28);
      animation: shine 3s infinite;
    }

    /* Exit transition */
    .page-exit {
      animation: pageExit 0.8s ease forwards;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: scale(0.75) rotate(-3deg);
      }

      to {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    @keyframes pageExit {
      to {
        opacity: 0;
        transform: scale(1.1);
        filter: blur(8px);
      }
    }

    @keyframes floatClue {
      0%,
      100% {
        opacity: 0.25;
        transform: translateY(0) rotate(-3deg);
      }

      50% {
        opacity: 0.9;
        transform: translateY(-17px) rotate(3deg);
      }
    }

    @keyframes twinkle {
      0%,
      100% {
        opacity: 0.2;
        transform: scale(0.7);
      }

      50% {
        opacity: 1;
        transform: scale(1.3);
      }
    }

    @keyframes glowMove {
      from {
        transform: translateY(-20px) translateX(0);
      }

      to {
        transform: translateY(20px) translateX(35px);
      }
    }

    @keyframes textGlow {
      from {
        text-shadow: 0 0 3px #ff6ddc;
      }

      to {
        text-shadow: 0 0 13px #ff6ddc;
      }
    }

    @keyframes titlePulse {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.03);
      }
    }

    @keyframes blink {
      0%,
      45% {
        opacity: 1;
      }

      46%,
      100% {
        opacity: 0;
      }
    }

    @keyframes shine {
      0% {
        left: -80%;
      }

      35%,
      100% {
        left: 130%;
      }
    }

    @media (max-width: 360px) {
      .archive-card {
        padding: 32px 18px 28px;
      }

      .archive-card h1 {
        letter-spacing: 2px;
      }

      .floating-clues span {
        font-size: 8px;
      }
    }
  </style>
</head>

<body>
  <main class="archive-page" id="archivePage">

    <div class="floating-clues" aria-hidden="true">
      <span>CLASSIFIED</span>
      <span>BESTIE DETECTED</span>
      <span>SUS 👀</span>
      <span>STRAIGHT DAW</span>
      <span>CHAOS LOADING</span>
      <span>TOP SECRET ✦</span>
    </div>

    <div class="stars" aria-hidden="true">
      <span>✦</span>
      <span>✧</span>
      <span>✦</span>
      <span>⋆</span>
    </div>

    <section class="archive-card">
      <p class="small-label">✦ SECRET ARCHIVE ✦</p>

      <h1>ACCESS GRANTED</h1>

      <p id="typing-text"></p>

      <p class="warning-text">
        Warning: unexpected friendship content detected.
      </p>

      <button type="button" onclick="openFile()">
        OPEN FILE
        <span class="button-shine"></span>
      </button>
    </section>
  </main>

  <script>
    const typingText = document.getElementById("typing-text");
    const archivePage = document.getElementById("archivePage");

    const message = "Subject: My favorite problem.";
    let letterIndex = 0;

    function typeMessage() {
      if (letterIndex < message.length) {
        typingText.textContent += message.charAt(letterIndex);
        letterIndex++;
        setTimeout(typeMessage, 75);
      }
    }

    function openFile() {
      archivePage.classList.add("page-exit");

      setTimeout(() => {
        window.location.href = "clue1.html";
      }, 800);
    }

    window.addEventListener("load", typeMessage);
  </script>
</body>
  </html>
