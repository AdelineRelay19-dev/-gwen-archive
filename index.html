<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Little Surprise</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: white;
      font-family: Georgia, serif;
      background:
        radial-gradient(circle at center, #4b123f, #190b24 50%, #08040d);
    }

    .screen {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .start-box {
      width: min(90vw, 430px);
      padding: 42px 25px;
      text-align: center;
      border: 1px solid #ff4fc3;
      border-radius: 18px;
      background: rgba(36, 5, 44, 0.9);
      box-shadow:
        0 0 12px #ff4fc3,
        0 0 35px rgba(255, 79, 195, 0.5);
    }

    .small-text {
      color: #ffd3f1;
      font-size: 11px;
      letter-spacing: 3px;
    }

    h1 {
      margin: 35px 0 15px;
      color: #ffb7e9;
      letter-spacing: 5px;
    }

    p {
      color: #ffe1f4;
      line-height: 1.6;
    }

    .start-button {
      margin-top: 25px;
      padding: 15px 32px;
      border: none;
      border-radius: 30px;
      color: white;
      background: #df2da5;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 0 18px #ff45bd;
    }

    .start-button:active {
      transform: scale(0.94);
    }

    .loading {
      display: none;
      margin-top: 28px;
    }

    .loading.show {
      display: block;
    }

    .percentage {
      margin-bottom: 12px;
      color: #ffb7e9;
      font-size: 30px;
      font-weight: bold;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      overflow: hidden;
      border: 1px solid #ff70ce;
      border-radius: 20px;
      background: #26082c;
    }

    .progress {
      width: 0%;
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(
        90deg,
        #ff229e,
        #ffdf5d,
        #55eaff
      );
      transition: width 0.04s linear;
    }

    /* Floating designs */
    .floating-designs {
      position: fixed;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .floating {
      position: absolute;
      bottom: -50px;
      color: #ff9ee2;
      font-family: Georgia, serif;
      text-shadow:
        0 0 8px #ff4fc3,
        0 0 16px #ff4fc3;
      opacity: 0;
      animation: floatUp linear infinite;
    }

    .floating:nth-child(1) {
      left: 8%;
      font-size: 25px;
      animation-duration: 9s;
      animation-delay: 0s;
    }

    .floating:nth-child(2) {
      left: 22%;
      font-size: 18px;
      animation-duration: 12s;
      animation-delay: 2s;
    }

    .floating:nth-child(3) {
      left: 38%;
      font-size: 28px;
      animation-duration: 10s;
      animation-delay: 4s;
    }

    .floating:nth-child(4) {
      left: 55%;
      font-size: 20px;
      animation-duration: 13s;
      animation-delay: 1s;
    }

    .floating:nth-child(5) {
      left: 72%;
      font-size: 26px;
      animation-duration: 11s;
      animation-delay: 5s;
    }

    .floating:nth-child(6) {
      left: 88%;
      font-size: 19px;
      animation-duration: 14s;
      animation-delay: 3s;
    }

    .floating:nth-child(7) {
      left: 48%;
      font-size: 15px;
      animation-duration: 8s;
      animation-delay: 6s;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.8);
        opacity: 0;
      }

      15% {
        opacity: 0.9;
      }

      75% {
        opacity: 0.8;
      }

      100% {
        transform: translateY(-115vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <!-- Floating background designs -->
  <div class="floating-designs">
    <span class="floating">✦</span>
    <span class="floating">♡</span>
    <span class="floating">✧</span>
    <span class="floating">♥</span>
    <span class="floating">✦</span>
    <span class="floating">♡</span>
    <span class="floating">✧</span>
  </div>

  <main class="screen">
    <section class="start-box">
      <div class="small-text">✦ A LITTLE SURPRISE ✦</div>

      <h1>READY?</h1>

      <p id="introText">
        Press start before anything else.
      </p>

      <button class="start-button" id="startButton">
        START ✦
      </button>

      <div class="loading" id="loading">
        <div class="percentage" id="percentage">1%</div>

        <div class="progress-bar">
          <div class="progress" id="progress"></div>
        </div>

        <p id="loadingText">Preparing the surprise...</p>
      </div>
    </section>
  </main>

  <script>
    const startButton = document.getElementById("startButton");
    const loading = document.getElementById("loading");
    const percentage = document.getElementById("percentage");
    const progress = document.getElementById("progress");
    const loadingText = document.getElementById("loadingText");
    const introText = document.getElementById("introText");

    startButton.addEventListener("click", function () {
      startButton.style.display = "none";
      introText.style.display = "none";
      loading.classList.add("show");

      let number = 1;

      const timer = setInterval(function () {
        percentage.textContent = number + "%";
        progress.style.width = number + "%";

        if (number === 35) {
          loadingText.textContent = "Loading the sparkles...";
        }

        if (number === 70) {
          loadingText.textContent = "Almost ready...";
        }

        if (number >= 100) {
          clearInterval(timer);

          setTimeout(() => {
            window.location.href = "./archive.html";
          }, 600);
        }

        number++;
      }, 45);
    });
  </script>

</body>
</html>
